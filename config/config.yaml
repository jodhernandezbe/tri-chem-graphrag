KNOWLEDGE_GRAPH:
  NODES:
    - NODE_TYPE: Chemical
      PROPERTIES:
        - COLUMN: chemical_name
          NAME: name
        - COLUMN: cas_number
          NAME: cas_number
        - COLUMN: canonical_smiles
          NAME: canonical_smiles
        - COLUMN: tri_chem_id
          NAME: tri_chem_id
    - NODE_TYPE: Facility
      PROPERTIES:
        - COLUMN: trifid
          NAME: trifid
        - COLUMN: facility_state
          NAME: state
    - NODE_TYPE: Activity
      PROPERTIES:
        - COLUMN: chemical_activity
          NAME: name
    - NODE_TYPE: Reduction
      PROPERTIES:
        - COLUMN: source_reduction_code
          NAME: code
        - COLUMN: source_reduction_description
          NAME: name
    - NODE_TYPE: Sector
      PROPERTIES:
        - COLUMN: naics_code
          NAME: naics_code
        - COLUMN: naics_title
          NAME: naics_title
    - NODE_TYPE: Report
      PROPERTIES:
        - COLUMN: document_control_number
          NAME: document_control_number
        - COLUMN: reporting_year
          NAME: reporting_year
  EDGES:
    - EDGE_TYPE: CLASSIFIED_AS
      FROM_NODE_TYPE: Facility
      TO_NODE_TYPE: Sector
      PROPERTIES: []
    - EDGE_TYPE: DOCUMENTS
      FROM_NODE_TYPE: Report
      TO_NODE_TYPE: Reduction
      PROPERTIES:
        - COLUMN: annual_reduction
          NAME: annual_reduction
          NOTE: I consider the minimum of the interval as a conservative estimate.
    - EDGE_TYPE: REPORTS_ON
      FROM_NODE_TYPE: Report
      TO_NODE_TYPE: Chemical
      PROPERTIES:
        - COLUMN: maximum_amount
          NAME: maximum_amount
          NOTE: I consider the midpoint of the interval as a conservative estimate.
    - EDGE_TYPE: FILED_BY
      FROM_NODE_TYPE: Report
      TO_NODE_TYPE: Facility
      PROPERTIES: []
    - EDGE_TYPE: RECORDS
      FROM_NODE_TYPE: Report
      TO_NODE_TYPE: Activity
      PROPERTIES: []
RAG_GRAPH:
  RETRIEVAL:
    TOP_K: 5
    MAX_CONTEXT_CHARS: 8000
    GRAPH_CONTEXT_LIMIT: 50
    # Chemical embedding index used for SMILES similarity at inference. Must match an
    # EMBEDDING_TYPE below. Defaults to the best evaluated performer (see docs/RESULTS.md);
    # MolDeBERTa was the prior hardcoded value and the weakest performer.
    CHEMICAL_EMBEDDING_TYPE: Hybrid
  GENERATION:
    MODEL: "llama3.1"
    BASE_URL: "http://localhost:11434"
    TEMPERATURE: 0.0
  RAGAS:
    # Judge for RAGAS scoring, kept separate from the generator. RAGAS' list-structured
    # faithfulness/recall prompts need a GPT-4-class judge — local 7-14B judges emit the wrong
    # schema (→ NaN) and the smallest local model that can (qwen2.5:32b) is too slow.
    # Select where the judge runs; the chosen provider's key is checked loudly at startup.
    #   openai       → ChatOpenAI (needs OPENAI_API_KEY); JUDGE_MODEL e.g. gpt-4o-mini
    #   ollama_cloud → hosted open model (needs OLLAMA_API_KEY); JUDGE_MODEL e.g. gpt-oss:120b-cloud
    #   ollama_local → local Ollama (JUDGE_MODEL e.g. qwen2.5:7b); precision-only — faith/recall NaN
    JUDGE_PROVIDER: "ollama_cloud"
    JUDGE_MODEL: "gpt-oss:120b-cloud"
    # OpenAI handles concurrency well, so a few parallel workers speed up scoring; the
    # generous per-call timeout is a safety margin (cloud calls return in seconds).
    MAX_WORKERS: 4
    JUDGE_TIMEOUT: 600
  EMBEDDINGS:
    - EMBEDDING_TYPE: MorganFingerprint
      PROPERTIES:
        - RADIUS: 2
          N_BITS: 2048
    - EMBEDDING_TYPE: MolDeBERTa
      PROPERTIES:
        - MODEL_NAME: "SaeedLab/MolDeBERTa-base-123M-mtr"
          MAX_LENGTH: 128
    - EMBEDDING_TYPE: Hybrid
      PROPERTIES:
        - MODEL_NAME: "SaeedLab/MolDeBERTa-base-123M-mtr"
          MAX_LENGTH: 128
    - EMBEDDING_TYPE: NAICSEmbeddings
      PROPERTIES:
        - MODEL_NAME: "sentence-transformers/all-MiniLM-L6-v2"
          MAX_LENGTH: 512
    - EMBEDDING_TYPE: ActivityEmbeddings
      PROPERTIES:
        - MODEL_NAME: "sentence-transformers/all-MiniLM-L6-v2"
          MAX_LENGTH: 512
