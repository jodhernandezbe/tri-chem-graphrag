[project]
name = "tri-chem-graphrag"
version = "0.1.0"
description = "Code for generating a Neo4j knowledge graph based on TRI and LangGraph GraphRAG"
authors = [
    {name = "Jose D. Hernandez-Betancur", email = "jodhernandezbemj@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "requests (>=2.33.1,<3.0.0)",
    "rdkit (>=2026.3.1,<2027.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "chardet (>=7.4.3,<8.0.0)",
    "neo4j (>=6.1.0,<7.0.0)",
    "aiohttp (>=3.13.5,<4.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "transformers (>=5.8.0,<6.0.0)",
    "torch (>=2.11.0,<3.0.0)",
    "langchain-core (>=1.3.3,<2.0.0)",
    "langchain (>=1.2.17,<2.0.0)",
    "langgraph (>=1.1.10,<2.0.0)",
    "langchain-ollama (>=0.3.3,<0.4.0)",
    "langchain-neo4j (>=0.9.0,<1.0.0)",
    "langchain-openai (>=1.0.0,<2.0.0)",
    "pyyaml (>=6.0.0,<7.0.0)",
    "fastapi[standard] (>=0.115.0,<1.0.0)",
    "scikit-learn (>=1.5.0,<2.0.0)",
    "scipy (>=1.13.0,<2.0.0)",
    "numpy (>=1.26.0,<3.0.0)",
    "matplotlib (>=3.9.0,<4.0.0)",
    "umap-learn (>=0.5.7,<0.6.0)",
    "ragas (>=0.2.0,<1.0.0)",
    "datasets (>=2.20.0,<4.0.0)",
    ]

[project.urls]
"Homepage" = "https://github.com/jodhernandezbe/tri-chem-graphrag"
"Bug Tracker" = "https://github.com/jodhernandezbe/tri-chem-graphrag"

[tool.poetry]
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "interrogate (>=1.7.0,<2.0.0)",
    "pyright (>=1.1.408,<2.0.0)",
    "pytest (>=9.0.3,<10.0.0)"
]

[tool.black]
line-length = 128
include = '\.pyi?$'
exclude = '''
/(
	\.git
| \.hg
| \.mypy_cache
| \.tox
| \.venv
| _build
| buck-out
| build
)/
'''

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = true
ignore-nested-functions = false
ignore-nested-classes = true
ignore-setters = false
fail-under = 95
exclude = ["setup.py", "docs", "build"]
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
verbose = 0
quiet = false
whitelist-regex = []
color = true

[tool.pyright]
include = ["src"]
extraPaths = ["src"] # for imports from other roots in subdirs
exclude = ["tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportMissingImports = true
reportMissingTypeStubs = false
stubPath = './typestubs'
venv = '.'

[tool.bandit]
exclude_dirs = ["tests"]
