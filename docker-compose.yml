---
services:
  neo4j:
    image: neo4j:5.15-community
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/tri_neo4j_password
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Keep a single model resident at a time so the generator (llama3.1) and the
      # RAGAS judge (granite3.3:8b) swap instead of stacking — both ~5 GB models do
      # not fit together in the constrained Docker VM.
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=30s
    restart: unless-stopped

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: python-app-dev
    depends_on:
      - neo4j
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=tri_neo4j_password
    volumes:
      - .:/app
      - /app/docs
      - /app/Dockerfile*
      - /app/docker-compose*
      - ~/.cache/huggingface:/root/.cache/huggingface
      - venv_dev:/app/.venv
    ports:
      - "8000:8000"
    working_dir: /app
    command: bash /app/entrypoint.sh

  app-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: python-app-prod
    depends_on:
      - neo4j
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./config:/app/config
    working_dir: /app
    profiles:
      - prod

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:
  venv_dev:
